global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: proxmox-node
    static_configs:
      - targets:
          - 192.168.1.220:9100

  - job_name: debian-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: docker-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: proxmox-api
    metrics_path: /pve
    params:
      module:
        - default
      cluster:
        - "1"
      node:
        - "1"
    static_configs:
      - targets:
          - 192.168.1.220
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
